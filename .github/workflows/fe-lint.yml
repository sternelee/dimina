name: Frontend Lint

on:
  # Fork code must run in the pull request's restricted security context.
  pull_request:
    paths:
      - 'fe/**'
      - 'examples/miniprogram/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Run Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: fe/.nvmrc

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12.2.0
          package-json-file: fe/package.json
          install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        working-directory: ./fe
        shell: bash
        run: |
          store_path="$(pnpm store path)"
          test -n "$store_path"
          echo "STORE_PATH=$store_path" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('fe/**/package.json', 'fe/pnpm-workspace.yaml') }}

      - name: Install dependencies
        working-directory: ./fe
        run: pnpm install --no-frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Run linter
        working-directory: ./fe
        run: ./node_modules/.bin/oxlint
