name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.0)'
        required: true
        type: string
      skip_changelog:
        description: 'Skip changelog generation'
        required: false
        type: boolean
        default: false

jobs:
  native-dependency-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate pinned native dependencies
        run: ./scripts/update-native-dependencies.sh --check

  changelog:
    if: github.event_name == 'push' || !inputs.skip_changelog
    needs: native-dependency-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: fe/.nvmrc

      - name: Generate Changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  swift-package:
    if: always()
    runs-on: macos-26
    needs: changelog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Show Swift and Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          # Remove 'v' prefix if present
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG, Extracted version: $VERSION"

      - name: Verify Swift package manifest
        run: |
          swift package dump-package > /tmp/package.json
          grep '"name" : "Dimina"' /tmp/package.json
          echo "Swift package manifest is valid for tag v${{ steps.version.outputs.version }}"

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Resolve Xcode package dependencies
        run: xcodebuild -resolvePackageDependencies -project iOS/dimina.xcodeproj -scheme dimina

      - name: Build iOS example
        run: xcodebuild -project iOS/dimina.xcodeproj -scheme dimina -destination 'generic/platform=iOS Simulator' build

  ios-map-amap:
    runs-on: macos-26
    needs: native-dependency-versions
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Package optional AMap Swift package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 scripts/package-ios-amap.py --version "${RELEASE_TAG#v}" --output "$RUNNER_TEMP/map-release"
      - name: Build optional Swift package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/map-release/DiminaMapAMap-${RELEASE_TAG#v}"
          xcodebuild -scheme DiminaMapAMap -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/map-build" CODE_SIGNING_ALLOWED=NO build
      - name: Attach Swift package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # Existing binary URLs may already be pinned by a published Swift Package checksum.
          overwrite_files: false
          files: |
            ${{ runner.temp }}/map-release/DiminaMapAMap-*.zip
            ${{ runner.temp }}/map-release/*.xcframework.zip
      - name: Publish independent Swift Package repository
        env:
          GH_TOKEN: ${{ secrets.DIMINA_MAP_AMAP_TOKEN }}
          PACKAGE_REPOSITORY: ${{ vars.DIMINA_MAP_AMAP_REPOSITORY }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ -z "$GH_TOKEN" || -z "$PACKAGE_REPOSITORY" ]]; then
            echo "::notice::Independent package sync requires DIMINA_MAP_AMAP_REPOSITORY and DIMINA_MAP_AMAP_TOKEN; generated package and binary assets are attached to the release."
            exit 0
          fi
          gh auth setup-git
          bash scripts/publish-ios-amap-repository.sh \
            "$RUNNER_TEMP/map-release/DiminaMapAMap-${RELEASE_TAG#v}-repository" \
            "$PACKAGE_REPOSITORY" "${RELEASE_TAG#v}"
