name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'fe/**'
      - 'examples/miniprogram/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        id: node-setup
        with:
          node-version-file: fe/.nvmrc

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12.2.0
          package-json-file: fe/package.json
          install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        working-directory: ./fe
        shell: bash
        run: |
          store_path="$(pnpm store path)"
          test -n "$store_path"
          echo "STORE_PATH=$store_path" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('fe/**/package.json', 'fe/pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./fe
        run: pnpm install

      - name: Build project
        working-directory: ./fe
        run: |
          pnpm compile
          pnpm build
        env: 
          ASSETS_PATH_PREFIX: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './fe/packages/container/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
