name: iOS Tests

on:
  push:
    paths: ['iOS/**', 'harmony/**', 'shared/**', '.github/workflows/ios-tests.yml']
  pull_request:
    paths: ['iOS/**', 'harmony/**', 'shared/**', '.github/workflows/ios-tests.yml']
  workflow_dispatch:

jobs:
  unit-test:
    name: iOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: iOS/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('iOS/dimina.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        working-directory: ./iOS
        run: |
          xcodebuild -resolvePackageDependencies \
            -project dimina.xcodeproj \
            -scheme dimina \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Select eligible iOS Simulator
        id: simulator
        working-directory: ./iOS
        run: |
          set -euo pipefail
          select_simulator() {
            xcodebuild -showdestinations \
              -project dimina.xcodeproj \
              -scheme dimina \
              -clonedSourcePackagesDirPath SourcePackages \
              -disableAutomaticPackageResolution > "$RUNNER_TEMP/dimina-destinations.txt"
            cat "$RUNNER_TEMP/dimina-destinations.txt"
            SIMULATOR_UDID="$(
              ruby -e '
                available = File.read(ARGV.fetch(0)).split(/Ineligible destinations|Destinations incompatible/).first
                devices = available.lines.filter_map do |line|
                  next unless line.include?("platform:iOS Simulator,")
                  next unless line.match?(/name:iPhone/)
                  next if line.include?("error:")
                  udid = line[/id:([0-9A-Fa-f-]{36})/, 1]
                  version = line[/OS:([0-9.]+)/, 1]
                  [version.split(".").map(&:to_i), udid] if udid && version
                end
                simulator = devices.max_by(&:first)
                puts simulator.last if simulator
              ' "$RUNNER_TEMP/dimina-destinations.txt"
            )"
          }

          select_simulator
          if [[ -z "$SIMULATOR_UDID" ]]; then
            # Hosted runner images may not include a runtime for the selected Xcode.
            xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes --json > "$RUNNER_TEMP/dimina-runtimes.json"
            cat "$RUNNER_TEMP/dimina-runtimes.json"
            SIMULATOR_CONFIG="$(
              ruby -rjson -rrubygems -e '
                sdk = Gem::Version.new(ARGV.fetch(1))
                runtimes = JSON.parse(File.read(ARGV.fetch(0))).fetch("runtimes").select do |runtime|
                  runtime["isAvailable"] &&
                    runtime.fetch("identifier").start_with?("com.apple.CoreSimulator.SimRuntime.iOS-") &&
                    Gem::Version.new(runtime.fetch("version")) <= sdk
                end
                runtime = runtimes.max_by { |item| Gem::Version.new(item.fetch("version")) }
                abort "No available iOS runtime compatible with the selected Xcode SDK #{sdk}" unless runtime
                device_type = runtime.fetch("supportedDeviceTypes").find do |item|
                  item["productFamily"] == "iPhone"
                end
                abort "No iPhone device type supports #{runtime.fetch("name")}" unless device_type
                puts "#{runtime.fetch("identifier")} #{device_type.fetch("identifier")}"
              ' "$RUNNER_TEMP/dimina-runtimes.json" "$(xcrun --sdk iphonesimulator --show-sdk-version)"
            )"
            read -r RUNTIME_ID DEVICE_TYPE_ID <<< "$SIMULATOR_CONFIG"
            CREATED_UDID="$(xcrun simctl create "Dimina CI" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
            xcrun simctl boot "$CREATED_UDID"
            xcrun simctl bootstatus "$CREATED_UDID" -b
            select_simulator
          fi

          if [[ -z "$SIMULATOR_UDID" ]]; then
            xcrun simctl list devices available
            echo "::error::No iPhone Simulator is eligible after runtime installation; check deployment targets and Xcode diagnostics above"
            exit 1
          fi
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          echo "Using eligible iOS Simulator $SIMULATOR_UDID"

      - name: Run unit tests
        working-directory: ./iOS
        run: |
          xcodebuild test \
            -project dimina.xcodeproj \
            -scheme dimina \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            -resultBundlePath TestResults.xcresult

      - name: Compress test results
        if: always()
        working-directory: ./iOS
        run: test -d TestResults.xcresult && zip -qr TestResults.xcresult.zip TestResults.xcresult || true

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-reports
          path: ./iOS/TestResults.xcresult.zip
          retention-days: 5
          if-no-files-found: ignore
