name: Harmony Tests

on:
  push:
    paths:
      - 'harmony/**'
      - 'shared/**'
      - 'cmake/**'
      - '.github/workflows/harmony-tests.yml'
  pull_request:
    paths:
      - 'harmony/**'
      - 'shared/**'
      - 'cmake/**'
      - '.github/workflows/harmony-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-test:
    name: Harmony Local Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HARMONY_CLI_VERSION: '6.0.0.858'
      HARMONY_CLI_PART_A_SHA256: 'ce8e66b9b4a8c0f492e348595173cbccd685ed029e33eab4097d6affc184b4de'
      HARMONY_CLI_PART_B_SHA256: '785590e57b730333fdc9b71167dd7a32cb9341d88a7625704960b52c6dc33a35'
      HARMONY_CLI_ARCHIVE_SHA256: '7ac067277048601b1f32d94ad280a7a682f803bbed27262c9c488b48aedb48c5'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev libgl1-mesa-dri libminizip1 mesa-utils xvfb xauth

      - name: Cache Harmony command-line tools
        id: harmony-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/harmony-cli/${{ env.HARMONY_CLI_VERSION }}
          key: harmony-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.HARMONY_CLI_VERSION }}

      # Huawei's download center issues authenticated, short-lived URLs. This
      # fixed mirror release is third-party; pin both parts and the combined
      # archive so any byte-level change fails CI.
      - name: Install Harmony command-line tools
        if: steps.harmony-cli-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          install_root="$HOME/harmony-cli/$HARMONY_CLI_VERSION"
          archive="$RUNNER_TEMP/ohos-sdk-linux-amd64.tar.gz"
          download_base="https://github.com/ErBWs/ohos-sdk/releases/download/$HARMONY_CLI_VERSION/ohos-sdk-linux-amd64.tar.gz"

          mkdir -p "$install_root"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive.aa" "$download_base.aa"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive.ab" "$download_base.ab"

          echo "$HARMONY_CLI_PART_A_SHA256  $archive.aa" | sha256sum --check
          echo "$HARMONY_CLI_PART_B_SHA256  $archive.ab" | sha256sum --check

          cat "$archive.aa" "$archive.ab" > "$archive"
          rm "$archive.aa" "$archive.ab"
          echo "$HARMONY_CLI_ARCHIVE_SHA256  $archive" | sha256sum --check

          tar --extract --gzip --file "$archive" --directory "$install_root"
          rm "$archive"

          test -x "$install_root/command-line-tools/bin/hvigorw"
          test -x "$install_root/command-line-tools/bin/ohpm"

      - name: Configure Harmony toolchain
        run: |
          set -euo pipefail

          tool_root="$HOME/harmony-cli/$HARMONY_CLI_VERSION/command-line-tools"
          test -d "$tool_root/sdk"

          echo "$tool_root/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$tool_root/sdk" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$tool_root/sdk" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$tool_root/sdk/default/openharmony" >> "$GITHUB_ENV"

      - name: Repair Linux Previewer library names
        run: |
          set -euo pipefail

          previewer_dir="$OHOS_NDK_HOME/previewer/common/bin"
          hilog_library="$previewer_dir/libhilog_linux.so"
          minizip_library="$(ldconfig -p | awk '$1 == "libminizip.so.1" && path == "" { path = $NF } END { print path }')"

          test -f "$hilog_library"
          test -f "$minizip_library"

          # The Linux archive uses a platform-suffixed HiLog filename while
          # some Previewer components retain the generic DT_NEEDED name.
          ln --symbolic --force libhilog_linux.so "$previewer_dir/libhilog.so"

          # libide_extension links Huawei's libshared_libz name but only uses
          # the standard MiniZip unz* ABI provided by Ubuntu's libminizip.
          ln --symbolic --force "$minizip_library" "$previewer_dir/libshared_libz.so"

      - name: Verify Harmony toolchain
        run: |
          set -euo pipefail

          hvigorw -v
          ohpm --version

          previewer="$OHOS_NDK_HOME/previewer/common/bin/Previewer"
          test -x "$previewer"
          previewer_dependencies="$(ldd "$previewer")"
          printf '%s\n' "$previewer_dependencies"
          if grep --quiet 'not found' <<< "$previewer_dependencies"; then
            exit 1
          fi

          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x2400x24 -ac +extension GLX +render -noreset" \
            glxinfo -B

      - name: Cache ohpm packages
        uses: actions/cache@v4
        with:
          path: ~/.ohpm
          key: harmony-ohpm-${{ runner.os }}-${{ hashFiles('harmony/oh-package-lock.json5', 'harmony/dimina/oh-package-lock.json5', 'harmony/entry/oh-package-lock.json5') }}
          restore-keys: |
            harmony-ohpm-${{ runner.os }}-

      - name: Install Harmony dependencies
        working-directory: ./harmony
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Run Harmony local tests
        working-directory: ./harmony
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        # entry contains only DevEco's default scaffold case, which is already
        # duplicated in dimina. Build its HAP below without starting a second
        # Previewer instance.
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x2400x24 -ac +extension GLX +render -noreset"
          hvigorw test
          -p module=dimina
          -p coverage=true
          --no-parallel
          --no-daemon

      - name: Build Harmony SDK
        working-directory: ./harmony
        run: >-
          hvigorw --mode module
          -p product=default
          -p module=dimina@default
          assembleHar
          --analyze=normal
          --parallel
          --no-daemon

      - name: Build Harmony example app
        working-directory: ./harmony
        run: >-
          hvigorw --mode module
          -p product=default
          -p module=entry@default
          assembleHap
          --analyze=normal
          --parallel
          --no-daemon

      - name: Upload Harmony test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-test-reports
          path: |
            harmony/*/.test/default/outputs/test/reports/**
            harmony/*/.test/default/intermediates/test/coverage_data/test_result.txt
            harmony/*/.test/default/intermediates/test/coverage_data/coverage.log
          retention-days: 5
          if-no-files-found: warn
          include-hidden-files: true
