<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Dimina Benchmark</title>
		<style>
			html, body {
				margin: 0;
				min-height: 100%;
				background: #f5f5f5;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			.benchmark-layout {
				min-height: 100vh;
				display: grid;
				grid-template-columns: minmax(320px, 390px) minmax(280px, 1fr);
				gap: 24px;
				align-items: start;
				justify-content: center;
				box-sizing: border-box;
				padding: 24px;
			}
			#container {
				width: 390px;
				height: 844px;
				overflow: hidden;
				background: #fff;
			}
			.panel {
				max-width: 560px;
				background: #fff;
				padding: 20px;
				box-sizing: border-box;
			}
			.panel h1 {
				margin: 0 0 12px;
				font-size: 20px;
			}
			#status {
				white-space: pre-wrap;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 13px;
				line-height: 1.6;
			}
			@media (max-width: 760px) {
				.benchmark-layout {
					display: block;
					padding: 0;
				}
				.panel {
					display: none;
				}
				#container {
					width: 100vw;
					height: 100vh;
				}
			}
		</style>
	</head>
	<body>
		<div class="benchmark-layout">
			<div id="container"></div>
			<section class="panel">
				<h1>Dimina Benchmark</h1>
				<div id="status">booting…</div>
			</section>
		</div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
